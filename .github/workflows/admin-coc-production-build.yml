# Production Admin C.O.C. compile and prerender check. DigitalOcean App Platform
# builds the admin service with:
#   corepack enable && corepack prepare pnpm@10.32.1 --activate && pnpm install --frozen-lockfile && pnpm build:admin-coc
# The API production-build workflow does not run this Next.js build, so a green
# API check can still merge a broken /404, /_not-found, or Front Office prerender.
#
# The build step inherits NODE_ENV=development, which is the original failure.
# apps/admin-coc/scripts/production-build.cjs must override that to production
# before Next.js starts. Installation stays in its own step so the poisoned
# value cannot change which dependencies are installed.
name: Admin C.O.C. production build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-admin-coc:
    name: pnpm build:admin-coc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: corepack enable && corepack prepare pnpm@10.32.1 --activate && CI=true pnpm install --frozen-lockfile --prod=false

      - name: Production build with inherited NODE_ENV=development
        env:
          NODE_ENV: development
        run: |
          set -o pipefail
          pnpm build:admin-coc 2>&1 | tee /tmp/admin-coc-build.log
          if grep -q 'non-standard "NODE_ENV"' /tmp/admin-coc-build.log; then
            echo "production build kept NODE_ENV=development"
            exit 1
          fi
          if ! grep -q 'Generating static pages' /tmp/admin-coc-build.log; then
            echo "prerender did not run"
            exit 1
          fi
